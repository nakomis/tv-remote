name: TVRemote
options:
  bundleIdPrefix: com.nakomis
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "62YFUFBSFX"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  TVRemote:
    type: application
    platform: iOS
    sources:
      - path: TVRemote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nakomis.tvremote
        INFOPLIST_FILE: TVRemote/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ENABLE_PREVIEWS: YES

  TVRemoteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TVRemoteTests
    dependencies:
      - target: TVRemote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nakomis.tvremote.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  TVRemote:
    build:
      targets:
        TVRemote: all
        TVRemoteTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - TVRemote
      targets:
        - TVRemoteTests
